name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python toolkit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Test
        run: pytest -q tests --ignore=tests/integration

  web:
    name: Web app (security + integration tests, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cryptoshift_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cryptoshift_app/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Dependency audit (fails on high or critical)
        run: npm --prefix frontend audit --audit-level=high
      - name: Typecheck and build
        run: npm run build
      - name: Unit and integration tests
        run: npm test
