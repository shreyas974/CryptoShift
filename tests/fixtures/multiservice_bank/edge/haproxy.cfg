# SYNTHETIC fixture: edge load balancer
global
    ssl-default-bind-ciphers ECDHE-RSA-AES256-GCM-SHA384:AES128-SHA
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.1 no-tls-tickets
    tune.ssl.default-dh-param 2048

defaults
    mode http

frontend public
    bind :443 ssl crt /etc/haproxy/certs/edge_rsa.pem curves P-256
    # bind :8443 ssl ciphers RC4-SHA   HN commented out
    default_backend gateways

backend gateways
    server gw1 gateway:443 ssl verify required ssl-max-ver TLSv1.2
    server legacy1 10.20.30.40:443 check
