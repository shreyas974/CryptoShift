# SYNTHETIC fixture
services:
  gateway:
    image: nginx:1.27
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - payments
      - ledger
  edge:
    image: haproxy:3.0
    volumes:
      - ./edge:/usr/local/etc/haproxy:ro
    links:
      - "gateway:gw"
  payments:
    build: ./services/payments
    depends_on:
      ledger:
        condition: service_healthy
  ledger:
    build:
      context: ./services/ledger
