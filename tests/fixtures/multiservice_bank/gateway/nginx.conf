# SYNTHETIC fixture: API gateway
upstream payments_pool {
    server payments:8080;
}

server {
    listen 443 ssl;
    ssl_protocols TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:DHE-DSS-AES256-SHA;
    ssl_ecdh_curve X25519MLKEM768:X25519;
    # ssl_ciphers DES-CBC3-SHA;   HN commented out

    location /pay {
        proxy_pass http://payments_pool;
    }
    location /ledger {
        proxy_pass https://ledger:9443/api;
    }
    location /fraud {
        proxy_pass http://fraud-scoring.partner.example:7000;
    }
    location /local {
        proxy_pass http://127.0.0.1:9000;
    }
}
