[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoshift"
version = "0.1.0"
description = "Quant-A-Maze 3.0 (PQC-01): Verification-Gated Cryptographic Migration Across Banking Applications"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = []

[project.optional-dependencies]
qpiai = [
    "qpiai-opt[quantum]==0.0.9",
    "qpiai-quantum==0.3.0",
    "python-dotenv>=1.0.0",
]
mvp = [
    "pyyaml>=6.0.0",
    "tables>=3.9.0",
    "h5py>=3.10.0",
    "streamlit>=1.35.0",
    "pytest>=8.0.0",
]

[project.scripts]
cryptoshift = "cryptoshift.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cryptoshift*"]
